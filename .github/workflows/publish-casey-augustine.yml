name: Publish Casey Augustine tiles
on:
  push:
    branches: [email-assets]
    paths:
      - '.github/workflows/publish-casey-augustine.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
