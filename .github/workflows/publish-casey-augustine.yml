      - name: Commit tiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email/palecek-2026/08*.jpg email/palecek-2026/09*.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Add direct-linked Casey and Augustine tiles"
          git push origin HEAD:email-assets
